[project]
name = "jev-cancer"
version = "0.1.0"
description = "Zero-training histopathology classification with TypeSafe Jev"
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk[pil]==0.7.5",
    "python-dotenv==1.2.4",
    "numpy>=2.0",
    "pillow>=10.0",
    "kagglehub>=0.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["BLE001", "RUF046", "SIM108"]

# Prompt text is kept as single readable strings.
[tool.ruff.lint.per-file-ignores]
"jev_cancer/protocol.py" = ["E501"]
